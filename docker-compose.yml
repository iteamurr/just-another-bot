services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spacedreader}
      POSTGRES_USER: ${POSTGRES_USER:-spacedreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spacedreader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spacedreader} -d ${POSTGRES_DB:-spacedreader}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} && wait"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:

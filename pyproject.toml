[tool.poetry]
name = "spacedreader"
version = "0.1.0"
description = "Персональный трекер интервального повторения прочитанного"
authors = []
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.115.5"
uvicorn = { version = "0.32.1", extras = ["standard"] }
sqlalchemy = { version = "2.0.36", extras = ["asyncio"] }
asyncpg = "0.30.0"
alembic = "1.14.0"
pydantic = "2.10.3"
pydantic-settings = "2.6.1"
punq = "0.6.2"
httpx = "0.28.0"
openai = "1.57.0"
aiosql = "13.3"
pypika = "0.48.9"
streamlit = "1.40.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"
pytest-cov = "6.0.0"
testcontainers = { version = "4.8.1", extras = ["postgres"] }
ruff = "0.8.4"
mypy = "1.13.0"
types-aiofiles = "24.1.0.20241221"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "C90", # complex-structure
]
ignore = [
    "E501",  # line too long
    "B008",
    "UP006",
    "UP035",
    "C416",
    "B019",
    "UP007",
    "C901",
    "F821",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

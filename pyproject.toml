[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
package-mode = false

[project]
name = "spacedreader"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "punq==0.6.2",
    "httpx==0.28.0",
    "openai==1.57.0",
    "aiosql==13.3",
    "pypika==0.48.9",
    "streamlit==1.40.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "testcontainers[postgres]==4.8.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-aiofiles==24.1.0.20241221",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "C90", # complex-structure
]
ignore = [
    "E501",  # line too long
    "B008",
    "UP006",
    "UP035",
    "C416",
    "B019",
    "UP007",
    "C901",
    "F821",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
